name: Sync Shadowrocket and Clash rules

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - custom-rules.md
      - scripts/**
      - tests/**
      - .github/workflows/sync.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: sync-shadowrocket
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install generator dependencies
        run: npm ci --ignore-scripts
      - name: Test merge behavior
        run: node --test
      - name: Fetch and merge both configs
        run: npm run sync
      - name: Commit changed config
        run: |
          git add sr_cnip.conf clash-rules.yaml clash/providers clash/upstream.json clash/LICENSE-Loyalsoldier
          if git diff --cached --quiet; then
            echo "Config unchanged; no commit needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync Shadowrocket and Clash rules'
          git push origin HEAD:main
